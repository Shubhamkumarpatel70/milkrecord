name: Build and validate

on:
  push:
    branches:
      - main
      - improvements/security-and-stability
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci
      - name: Run frontend tests
        working-directory: client
        run: npm test -- --watchAll=false --runInBand
      - name: Build frontend
        working-directory: client
        run: npm run build

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install backend dependencies
        working-directory: server
        run: npm ci
      - name: Check backend JavaScript syntax
        run: |
          find server -name '*.js' -not -path 'server/node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Run backend tests
        working-directory: server
        run: npm test
